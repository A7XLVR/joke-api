<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Jokes</title>
  </head>
  <body>
    <h1>Random Jokes</h1>
    <button id="jokeButton">Get Joke</button>
    <div id="jokeContainer" style="margin-top: 20px;">
        <p id="jokeText"></p>
        <p id="jokePunchline"></p>
    </div>

    <script>
        const button = document.getElementById('jokeButton');
        const jokeText = document.getElementById('jokeText');
        const jokePunchline = document.getElementById('jokePunchline');

        button.addEventListener('click', async () => {
            try {
                const response = await fetch('/api/v1/random-joke');
                const data = await response.json();

                jokeText.textContent = data.joke;
                jokePunchline.textContent = data.punchline;
            } catch (error) {
                jokeText.textContent = 'Failed to fetch a joke. Please try again.';
                jokePunchline.textContent = '';
            }
        });
    </script>
  </body>
